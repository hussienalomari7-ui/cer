<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D13">
  <meta name="description" content="Certificates and verified credentials.">
  <title>Certificates | Hussien Alomari</title>

  <!-- Fonts: Plus Jakarta Sans (Latin) + Cairo (Arabic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       DESIGN TOKENS
       ===================================================================== */
    :root {
      --bg: #0B0D13;
      --text: #ECEEF5;
      --text-2: #A9AEC2;
      --text-3: #767B94;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);

      --indigo: #6C63FF;   /* electric indigo */
      --cyan: #3CD6F0;
      --purple: #7A3CF0;   /* deep purple */
      --amber: #F6B94A;
      --emerald: #35D39A;

      --r-lg: 22px;
      --r-md: 14px;
      --gutter: clamp(18px, 4vw, 48px);
      --ease-out: cubic-bezier(0.22, 0.8, 0.24, 1);

      --font: "Plus Jakarta Sans", "Cairo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-ar: "Cairo", "Tajawal", "Segoe UI", Tahoma, sans-serif;

      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body.is-intro,
    body.is-locked { overflow: hidden; }

    img { display: block; max-width: 100%; }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }
    [tabindex="-1"]:focus { outline: none; }

    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: none;
      transition: transform 0.35s var(--ease-out);
    }

    /* =====================================================================
       AMBIENT BACKGROUND (glows shift with the active certificate)
       ===================================================================== */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    .glow--indigo { width: 70vmax; height: 70vmax; left: -26vmax; top: -32vmax; background: radial-gradient(closest-side, rgba(108, 99, 255, 0.42), rgba(108, 99, 255, 0)); }
    .glow--cyan   { width: 60vmax; height: 60vmax; right: -24vmax; top: 8vh;    background: radial-gradient(closest-side, rgba(60, 214, 240, 0.24), rgba(60, 214, 240, 0)); }
    .glow--purple { width: 76vmax; height: 76vmax; left: 12vw; bottom: -48vmax;  background: radial-gradient(closest-side, rgba(122, 60, 240, 0.38), rgba(122, 60, 240, 0)); }
    .glow--amber  { width: 56vmax; height: 56vmax; right: -16vmax; bottom: -26vmax; background: radial-gradient(closest-side, rgba(246, 185, 74, 0.2), rgba(246, 185, 74, 0)); }

    .ambient[data-tone="0"] .glow--indigo { opacity: 1; }
    .ambient[data-tone="0"] .glow--cyan   { opacity: 0.55; }
    .ambient[data-tone="0"] .glow--purple { opacity: 0.7; }

    .ambient[data-tone="1"] .glow--indigo { opacity: 0.5; }
    .ambient[data-tone="1"] .glow--cyan   { opacity: 1; }
    .ambient[data-tone="1"] .glow--purple { opacity: 0.55; }

    .ambient[data-tone="2"] .glow--indigo { opacity: 0.55; }
    .ambient[data-tone="2"] .glow--cyan   { opacity: 0.35; }
    .ambient[data-tone="2"] .glow--purple { opacity: 1; }

    .ambient[data-tone="end"] .glow--indigo { opacity: 0.3; }
    .ambient[data-tone="end"] .glow--purple { opacity: 0.55; }
    .ambient[data-tone="end"] .glow--amber  { opacity: 1; }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .ambient::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(5, 6, 10, 0.55));
    }

    /* =====================================================================
       PHASE 1 — CINEMATIC INTRO
       ===================================================================== */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #000;
      overflow: hidden;
      transition: opacity 1s ease 0.1s;
    }

    .intro__video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;          /* keeps the original aspect ratio on every screen */
      background: #000;
      transition: transform 1.2s var(--ease-out), filter 1.2s ease;
    }

    .intro.is-gated .intro__video { filter: brightness(0.4) blur(2px); }

    .intro.is-leaving { opacity: 0; pointer-events: none; }
    .intro.is-leaving .intro__video { transform: scale(0.9); filter: blur(6px) brightness(0.8); }

    /* "Enter experience" gate (only shown when the browser blocks sound autoplay) */
    .intro__gate {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
      animation: fade-in 0.8s ease both;
    }

    .gate-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 8px;
      border: 0;
      background: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.01em;
      border-radius: 24px;
    }

    .gate-btn__ring {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      transition: transform 0.45s var(--ease-out), background 0.4s, box-shadow 0.5s;
    }
    .gate-btn__ring .icon { width: 26px; height: 26px; margin-left: 4px; }

    .gate-btn:hover .gate-btn__ring {
      transform: scale(1.06);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 12px rgba(255, 255, 255, 0.04), 0 0 70px rgba(108, 99, 255, 0.4);
    }

    .gate-hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 13px;
      color: var(--text-3);
    }
    .gate-hint .icon { width: 15px; height: 15px; }

    .intro__controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 max(20px, env(safe-area-inset-right)) max(24px, calc(env(safe-area-inset-bottom) + 12px)) max(20px, env(safe-area-inset-left));
      pointer-events: none;
      animation: fade-in 0.8s ease 0.7s both;
    }
    .intro__controls > * { pointer-events: auto; }

    .intro:not(.is-playing) .sound-btn { opacity: 0; visibility: hidden; }
    .sound-btn { transition: opacity 0.4s, visibility 0.4s, background 0.3s, border-color 0.3s; }
    .skip-btn { margin-left: auto; }
    .skip-btn:hover .icon { transform: translateX(3px); }

    .intro__progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      opacity: 0;
      transition: opacity 0.6s;
    }
    .intro.is-playing .intro__progress { opacity: 1; }
    .intro__progress span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.85));
      transform-origin: left center;
      transform: scaleX(0);
    }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* Shared glass pill (Skip intro, sound toggle, card chips) */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 15px;
      border-radius: 999px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      background: rgba(12, 14, 22, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      backdrop-filter: blur(16px) saturate(140%);
    }
    .chip .icon { width: 16px; height: 16px; }
    button.chip { cursor: pointer; transition: background 0.3s, border-color 0.3s, opacity 0.4s; }
    button.chip:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.24); }

    /* =====================================================================
       PHASE 2 — SHOWCASE LAYOUT
       ===================================================================== */
    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: clip;             /* off-screen slides never widen the page on mobile */
      transform: scale(0.97);
      transition: transform 1.4s var(--ease-out);
    }
    body.is-revealed .app { transform: none; }

    .shell {
      width: min(1200px, calc(100% - 2 * var(--gutter)));
      margin-inline: auto;
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: calc(clamp(18px, 3vw, 32px) + env(safe-area-inset-top));
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .identity__mark {
      width: 42px;
      height: 42px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1.5px solid transparent;
      background:
        linear-gradient(var(--bg), var(--bg)) padding-box,
        linear-gradient(135deg, var(--indigo), var(--cyan) 55%, var(--purple)) border-box;
    }

    .identity__name {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .identity__role {
      margin: 0;
      font-size: 13px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ghost-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-2);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.25s, border-color 0.25s, background 0.25s;
    }
    .ghost-btn:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.24); background: rgba(255, 255, 255, 0.06); }
    .ghost-btn:hover .icon { transform: rotate(-140deg); }

    /* Heading row */
    .showcase { padding-top: clamp(24px, 4vw, 48px); }

    .showcase__head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px 24px;
      flex-wrap: wrap;
    }

    .showcase__title {
      margin: 0;
      font-size: clamp(34px, 4.6vw, 52px);
      line-height: 1.02;
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .showcase__intro {
      margin: 12px 0 0;
      max-width: 54ch;
      color: var(--text-2);
      font-size: clamp(15px, 1.3vw, 16.5px);
    }

    .counter {
      margin: 0;
      font-size: 14px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .counter strong { color: var(--text); font-weight: 600; }

    /* =====================================================================
       STAGE + SLIDES
       Every slide sits in the same grid cell, so the stage always takes
       the height of the tallest slide (no jumping, no absolute positioning).
       ===================================================================== */
    .stage {
      display: grid;
      margin-top: clamp(22px, 3vw, 36px);
      touch-action: pan-y;
    }

    .slide {
      grid-area: 1 / 1;
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
      gap: clamp(20px, 3.5vw, 48px);
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transform: translate3d(var(--shift, 0px), 0, 0);
      transition: opacity 0.55s ease, transform 0.75s var(--ease-out), visibility 0s linear 0.75s;
    }
    .slide.is-before { --shift: -56px; }
    .slide.is-after  { --shift: 56px; }
    .slide.is-active {
      --shift: 0px;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.6s ease 0.06s, transform 0.75s var(--ease-out), visibility 0s;
    }
    .slide.is-dragging { transition: none; }

    /* Per-slide accent tones */
    .slide[data-tone="0"] { --tone-a: var(--indigo); --tone-b: var(--cyan); }
    .slide[data-tone="1"] { --tone-a: var(--cyan);   --tone-b: var(--indigo); }
    .slide[data-tone="2"] { --tone-a: var(--purple); --tone-b: #B18CFF; }
    .slide[data-tone="end"] { --tone-a: var(--amber); --tone-b: #FFD98A; }

    /* Staggered entrance of the info column (runs on navigation and on reveal) */
    .slide__info > * {
      transition: opacity 0.6s ease, transform 0.7s var(--ease-out);
    }
    .slide:not(.is-active) .slide__info > *,
    body:not(.is-revealed) .slide__info > * {
      opacity: 0;
      transform: translateY(12px);
    }
    .slide__info > :nth-child(2) { --d: 1; }
    .slide__info > :nth-child(3) { --d: 2; }
    .slide__info > :nth-child(4) { --d: 3; }
    .slide__info > :nth-child(5) { --d: 4; }
    .slide__info > :nth-child(6) { --d: 5; }
    .slide__info > :nth-child(7) { --d: 6; }
    .slide.is-active .slide__info > * {
      transition-delay: calc(var(--base, 0.12s) + var(--d, 0) * 55ms);
    }
    body.is-intro .slide__info > * { --base: 0.5s; }

    /* ---------- Left: certificate preview card ---------- */
    .slide__preview {
      perspective: 1400px;
      transition: transform 0.8s var(--ease-out);
    }
    .slide:not(.is-active) .slide__preview { transform: scale(0.965); }

    .card {
      position: relative;
      aspect-ratio: 1.414 / 1;
      border-radius: var(--r-lg);
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform 0.7s var(--ease-out);
    }
    .card.is-tilting { transition: transform 0.15s ease-out; }

    .card__frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      border-radius: inherit;
      background: #0D0F18;
      border: 1px solid var(--line-strong);
      cursor: zoom-in;
      box-shadow:
        0 50px 100px -40px rgba(0, 0, 0, 0.9),
        0 0 90px -30px color-mix(in srgb, var(--tone-a) 55%, transparent);
    }

    .card__backdrop {
      position: absolute;
      inset: -12%;
      width: 124%;
      height: 124%;
      max-width: none;
      object-fit: cover;
      filter: blur(30px) saturate(1.3) brightness(0.5);
      z-index: 0;
    }

    .card__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;          /* never crops a real certificate scan */
      padding: clamp(12px, 3%, 24px);
      z-index: 1;
      transition: transform 0.9s var(--ease-out);
    }
    .card:hover .card__img { transform: scale(1.035); }

    .card__sheen {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 255, 0.14), transparent 45%);
      opacity: 0;
      transition: opacity 0.5s;
    }
    .card:hover .card__sheen { opacity: 1; }

    .card__frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 30%, transparent 70%, rgba(0, 0, 0, 0.35));
    }

    .card__badge  { position: absolute; top: 14px; left: 14px; z-index: 4; }
    .card__badge .icon { color: var(--tone-b); }
    .card__expand { position: absolute; right: 14px; bottom: 14px; z-index: 4; }
    .card__expand:hover .icon { transform: scale(1.12); }

    /* ---------- Right: info panel ---------- */
    .panel {
      position: relative;
      padding: clamp(22px, 2.6vw, 34px);
      border-radius: var(--r-lg);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015)),
        rgba(14, 16, 25, 0.5);
      border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      backdrop-filter: blur(16px) saturate(140%);
      box-shadow: 0 30px 80px -45px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .issuer {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .issuer__mark {
      width: 44px;
      height: 44px;
      flex: none;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--tone-a) 80%, #000),
        color-mix(in srgb, var(--tone-b) 55%, #000));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 8px 24px -10px var(--tone-a);
    }
    .issuer__mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 6px; }

    .issuer__name {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text-2);
    }

    .slide__title {
      margin: 18px 0 0;
      font-size: clamp(26px, 2.6vw, 36px);
      line-height: 1.12;
      font-weight: 600;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 40px;
      margin: 18px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .meta dt { margin-bottom: 4px; font-size: 12.5px; color: var(--text-3); }
    .meta dd {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 15px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .copy-btn {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-3);
      cursor: pointer;
      transition: color 0.25s, border-color 0.25s, background 0.25s;
    }
    .copy-btn .icon { width: 14px; height: 14px; }
    .copy-btn:hover { color: var(--text); border-color: var(--line-strong); }
    .copy-btn.is-copied { color: var(--emerald); border-color: rgba(53, 211, 154, 0.4); }

    .slide__desc {
      margin: 16px 0 0;
      max-width: 60ch;
      font-size: 15.5px;
      line-height: 1.65;
      color: var(--text-2);
    }

    .skills {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 0;
      padding: 0;
    }
    .skills li {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--line);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 46px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s var(--ease-out), box-shadow 0.3s, background 0.3s, border-color 0.3s;
    }
    .btn--primary {
      color: #fff;
      background: var(--indigo);
      box-shadow: 0 10px 30px -12px rgba(108, 99, 255, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .btn--primary:hover {
      transform: translateY(-1px);
      background: #7A72FF;
      box-shadow: 0 16px 40px -14px rgba(108, 99, 255, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn--ghost {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--line-strong);
    }
    .btn--ghost:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.24); }

    /* =====================================================================
       PHASE 3 — THE ENDING SLIDE (locked vault + Arabic teaser)
       ===================================================================== */
    .vault {
      position: relative;
      aspect-ratio: 1.414 / 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: var(--r-lg);
      border: 1px dashed rgba(246, 185, 74, 0.24);
      background:
        radial-gradient(ellipse at 50% 55%, rgba(246, 185, 74, 0.1), transparent 60%),
        rgba(12, 13, 20, 0.45);
    }

    .vault__sheet {
      position: absolute;
      width: 54%;
      aspect-ratio: 1.414 / 1;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.9);
      filter: blur(0.6px);
      transition: transform 1s var(--ease-out) 0.1s;
    }
    .vault__sheet::before {
      content: "";
      position: absolute;
      inset: 24% 18% auto;
      height: 36%;
      border-radius: 2px;
      opacity: 0.6;
      background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0 3px, transparent 3px 16px);
    }
    .slide--end.is-active .vault__sheet--1 { transform: rotate(-9deg) translate(-17%, 5%); }
    .slide--end.is-active .vault__sheet--2 { transform: rotate(2deg) translate(0, -5%); }
    .slide--end.is-active .vault__sheet--3 { transform: rotate(10deg) translate(17%, 7%); }

    .vault__lock {
      position: relative;
      z-index: 2;
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--amber);
      background: rgba(20, 18, 14, 0.55);
      border: 1px solid rgba(246, 185, 74, 0.35);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 0 10px rgba(246, 185, 74, 0.05), 0 0 70px rgba(246, 185, 74, 0.3);
    }
    .vault__lock .icon { width: 28px; height: 28px; }

    .panel--end { font-family: var(--font-ar); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }
    .status--amber {
      --c: var(--amber);
      color: #F9D08C;
      background: rgba(246, 185, 74, 0.08);
      border: 1px solid rgba(246, 185, 74, 0.26);
    }
    .status--emerald {
      --c: var(--emerald);
      color: #BDEFD9;
      background: rgba(53, 211, 154, 0.06);
      border: 1px solid rgba(53, 211, 154, 0.22);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    .pulse {
      position: relative;
      width: 9px;
      height: 9px;
      flex: none;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 10px var(--c), 0 0 22px var(--c);
    }
    .pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--c);
      animation: pulse 2.4s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.75; }
      80%, 100% { transform: scale(3.4); opacity: 0; }
    }

    .teaser {
      margin: 22px 0 0;
      font-size: clamp(20px, 2.1vw, 26px);
      line-height: 1.85;
      font-weight: 600;
      color: var(--text);
      text-wrap: pretty;
    }

    .panel--end .btn { margin-top: 28px; font-family: var(--font-ar); }

    /* =====================================================================
       NAVIGATION CONTROLS
       ===================================================================== */
    .head-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .head-nav__buttons { display: flex; gap: 10px; }

    .nav-btn {
      flex: none;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--text);
      cursor: pointer;
      background: rgba(16, 18, 28, 0.55);
      border: 1px solid var(--line-strong);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: background 0.3s, border-color 0.3s, transform 0.3s var(--ease-out), opacity 0.3s;
    }
    .nav-btn .icon { width: 22px; height: 22px; }
    .nav-btn:not([aria-disabled="true"]):hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.26); }
    .nav-btn--next:not([aria-disabled="true"]):hover .icon { transform: translateX(3px); }
    .nav-btn--prev:not([aria-disabled="true"]):hover .icon { transform: translateX(-3px); }
    .nav-btn:not([aria-disabled="true"]):active { transform: scale(0.94); }
    .nav-btn[aria-disabled="true"] { opacity: 0.3; cursor: not-allowed; }

    /* Segmented progress bar: one segment per certificate + one for the ending */
    .progress {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: clamp(20px, 3vw, 30px);
    }

    .seg {
      position: relative;
      flex: 1;
      height: 28px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      border-radius: 6px;
    }
    .seg::before,
    .seg::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 3px;
      margin-top: -1.5px;
      border-radius: 3px;
    }
    .seg::before { background: rgba(255, 255, 255, 0.1); transition: background 0.3s; }
    .seg:hover::before { background: rgba(255, 255, 255, 0.2); }
    .seg::after {
      background: linear-gradient(90deg, var(--indigo), var(--cyan));
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 0.6s var(--ease-out), box-shadow 0.6s;
    }
    .seg.is-filled::after { transform: scaleX(1); }
    .seg.is-current::after { box-shadow: 0 0 14px rgba(60, 214, 240, 0.6); }

    .seg--end { flex: 0.6; }
    .seg--end::before { background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.2) 0 6px, transparent 6px 11px); }
    .seg--end::after { background: linear-gradient(90deg, var(--amber), #FFD98A); }
    .seg--end.is-current::after { box-shadow: 0 0 14px rgba(246, 185, 74, 0.6); }

    /* =====================================================================
       FOOTER (persistent status indicator)
       ===================================================================== */
    .site-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px 24px;
      padding-top: clamp(40px, 6vw, 72px);
      padding-bottom: calc(clamp(20px, 3vw, 28px) + env(safe-area-inset-bottom));
    }

    .status--footer {
      font-family: var(--font-ar);
      font-size: 13.5px;
      font-weight: 500;
    }

    .footer-note { margin: 0; font-size: 13px; color: var(--text-3); }

    /* =====================================================================
       LIGHTBOX (full-size view)
       ===================================================================== */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: max(64px, calc(env(safe-area-inset-top) + 56px)) clamp(14px, 4vw, 48px) max(24px, env(safe-area-inset-bottom));
      background: rgba(5, 6, 10, 0.84);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .lightbox.is-open { opacity: 1; }

    .lightbox__figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: min(1400px, 100%);
      transform: scale(0.96);
      transition: transform 0.45s var(--ease-out);
    }
    .lightbox.is-open .lightbox__figure { transform: none; }

    .lightbox__img {
      max-width: 100%;
      max-height: calc(100dvh - 170px);
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 40px 120px -30px rgba(0, 0, 0, 0.9);
    }

    .lightbox__caption { text-align: center; font-size: 14px; color: var(--text-2); }
    .lightbox__caption strong { display: block; margin-bottom: 2px; font-size: 15px; font-weight: 600; color: var(--text); }

    .lightbox__close {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      padding: 0;
      justify-content: center;
    }

    /* =====================================================================
       RESPONSIVE
       ===================================================================== */
    @media (max-width: 960px) {
      /* Stacked layout: the stage follows the active slide's height instead of the tallest one */
      .stage { position: relative; display: block; }
      .slide:not(.is-active) { position: absolute; top: 0; left: 0; right: 0; max-height: 100%; overflow: hidden; }
      .slide {
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        align-content: start;
      }
    }

    @media (max-width: 560px) {
      .label-sm-hidden {
        position: absolute !important;
        width: 1px; height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .ghost-btn { width: 40px; padding: 0; justify-content: center; }
      .card__badge, .card__expand { height: 32px; padding: 0 12px; font-size: 12px; }
      .card__badge { top: 10px; left: 10px; }
      .card__expand { right: 10px; bottom: 10px; width: 32px; padding: 0; justify-content: center; }
      .nav-btn { width: 46px; height: 46px; }
      .head-nav { width: 100%; justify-content: space-between; }
      .slide__desc { font-size: 15px; }
      .meta { gap: 14px 28px; }
      .status--footer { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.2s !important;
        transition-delay: 0s !important;
      }
      .slide { --shift: 0px !important; }
      .app, .intro.is-leaving .intro__video { transform: none !important; }
    }
    /* =====================================================================
       تعديلات تكبير الصورة والنصوص واستغلال المساحة الفارغة
       ===================================================================== */

    /* 1. توسيع عرض الصفحة الكلي لتكبير حجم الصورة والبطاقة تلقائياً */
    .shell {
      width: min(1420px, calc(100% - 2 * var(--gutter)));
    }

    /* 2. توسيط قسم الشهادات عمودياً للقضاء على الفراغ السفلي الكبير */
    .showcase {
      margin-block: auto;
      padding-block: clamp(20px, 3vh, 40px);
    }

    .site-footer {
      padding-top: clamp(24px, 3.5vh, 44px);
    }

    /* 3. إعطاء صورة الشهادة مساحة أكبر وموازنة طول البطاقة اليمنى معها */
    .slide {
      grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr);
      gap: clamp(24px, 3.5vw, 54px);
      align-items: stretch;
    }

    .panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(28px, 3.2vw, 46px);
    }

    /* 4. تكبير خط الوصف (Description) ليكون مريحاً للقراءة */
    .slide__desc {
      margin: 22px 0 0;
      max-width: 62ch;
      font-size: clamp(16.5px, 1.3vw, 18.5px);
      line-height: 1.75;
    }

    /* 5. تكبير التاغات / المهارات (Tags) */
    .skills {
      gap: 10px;
      margin: 26px 0 0;
    }

    .skills li {
      padding: 10px 18px;
      font-size: clamp(14px, 1.05vw, 15.5px);
    }

    /* 6. تحسين تناسق اسم الجهة المانحة والعنوان مع الحجم الجديد */
    .issuer__mark {
      width: 48px;
      height: 48px;
      font-size: 15px;
    }

    .issuer__name {
      font-size: 15.5px;
    }

    .slide__title {
      margin: 20px 0 0;
      font-size: clamp(28px, 2.7vw, 40px);
    }
  </style>
</head>

        lbImg.removeAttribute("src");
      }, 350);
      if (lastFocus) lastFocus.focus({ preventScroll: true });
    }

    lbClose.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", e => {
      if (e.target === lightbox || e.target.classList.contains("lightbox__figure")) closeLightbox();
    });

    /* ---------------------------------------------------------------------
       PHASE 1 — Intro video
       --------------------------------------------------------------------- */
    let introActive = true;
    let introFinishing = false;
    let progressRaf = 0;

    function startIntro() {
      introActive = true;
      introFinishing = false;
      body.classList.add("is-intro");
      body.classList.remove("is-revealed");
      app.inert = true;

      introEl.hidden = false;
      void introEl.offsetWidth;
      introEl.classList.remove("is-leaving", "is-playing", "is-gated");
      gate.hidden = true;
      introBar.style.transform = "scaleX(0)";

      if (video.error) { finishIntro({ instant: true }); return; }

      try { video.currentTime = 0; } catch { /* not seekable yet */ }
      video.volume = 1;
      video.muted = false;
      attemptPlay();
    }

    function attemptPlay() {
      let promise;
      try { promise = video.play(); } catch { finishIntro({ instant: true }); return; }
      if (!promise || typeof promise.then !== "function") { onPlaying(); return; }

      promise.then(onPlaying).catch(err => {
        if (introFinishing || !introActive) return;
        if (err && err.name === "NotAllowedError") showGate();       // sound autoplay blocked
        else if (err && err.name === "AbortError") return;           // interrupted, ignore
        else finishIntro({ instant: true });                          // missing / unsupported file
      });
    }

    function showGate() {
      introEl.classList.add("is-gated");
      gate.hidden = false;
    }

    function onPlaying() {
      if (!introActive) return;
      gate.hidden = true;
      introEl.classList.remove("is-gated");
      introEl.classList.add("is-playing");
      updateSoundButton();
      cancelAnimationFrame(progressRaf);
      const tick = () => {
        if (video.duration) introBar.style.transform = `scaleX(${video.currentTime / video.duration})`;
        progressRaf = requestAnimationFrame(tick);
      };
      tick();
    }

    function updateSoundButton() {
      const muted = video.muted;
      soundBtn.setAttribute("aria-pressed", String(muted));
      soundLabel.textContent = muted ? "Sound on" : "Mute";
      soundBtn.querySelector(".icon-sound-on").hidden = muted;
      soundBtn.querySelector(".icon-sound-off").hidden = !muted;
    }

    enterBtn.addEventListener("click", () => {
      video.muted = false;
      video.play().then(onPlaying).catch(() => {
        // Still blocked: play silently and let the viewer turn sound on
        video.muted = true;
        video.play().then(onPlaying).catch(() => finishIntro({ instant: true }));
      });
    });

    soundBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) video.volume = 1;
      updateSoundButton();
    });

    skipBtn.addEventListener("click", () => finishIntro());
    video.addEventListener("ended", () => finishIntro());
    video.addEventListener("error", () => finishIntro({ instant: true }));

    function fadeOutAudio(ms) {
      if (video.muted || video.paused || !ms) return;
      const start = performance.now();
      const from = video.volume;
      const fade = now => {
        const k = Math.min(1, (now - start) / ms);
        video.volume = Math.max(0, from * (1 - k));
        if (k < 1) requestAnimationFrame(fade);
      };
      requestAnimationFrame(fade);
    }

    function finishIntro({ instant = false } = {}) {
      if (!introActive || introFinishing) return;
      introFinishing = true;
      cancelAnimationFrame(progressRaf);
      fadeOutAudio(instant ? 0 : 700);

      body.classList.add("is-revealed");
      introEl.classList.add("is-leaving");

      const duration = instant || reducedMotion.matches ? 450 : 1200;
      setTimeout(() => {
        video.pause();
        introEl.hidden = true;
        introEl.classList.remove("is-playing", "is-gated");
        body.classList.remove("is-intro");
        app.inert = false;
        introActive = false;
        introFinishing = false;
        updateHash();
        pageTitle.focus({ preventScroll: true });
      }, duration);
    }

    replayBtn.addEventListener("click", startIntro);

    /* ---------------------------------------------------------------------
       Boot
       --------------------------------------------------------------------- */
    renderChrome();
    renderSlides();
    bindTilt();
    goTo(indexFromHash());
    startIntro();
  })();
  </script>
</body>
</html>
